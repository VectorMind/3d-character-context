[project]
name = "character-context"
version = "0.1.0"
description = "Generative-first 3D character workbench: hosted generation to canonical, rigged production assets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "wassfila" }]

dependencies = [
    # contracts
    "pydantic>=2.9",
    # configuration (config/*.yaml, never secrets)
    "pyyaml>=6.0",
    # hosted generation: Gradio Spaces are the only free image-to-3d path
    "gradio-client>=1.7",
    # artifact download (external tools, provider files)
    "httpx>=0.27",
    # geometry: measurement and inspection
    "numpy>=1.26",
    "trimesh>=4.4",
    # trimesh graph engines - mandatory, not optional (see OP-010 doctrine):
    # connected-component counts are part of the mesh-report contract
    "networkx>=3.3",
    "scipy>=1.13",
    # volumetric part labelling: 3D skeletonization for medial axes, compact
    # watershed, true Euclidean geodesics through a volume, and marching cubes.
    # Approved 2026-08-30; rationale and the probe behind it are in
    # plans/2026-08/30-body-part-labeling/plan.md.
    "scikit-image>=0.24",
]

[project.scripts]
charctx = "character_context.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/character_context"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits a real provider; costs quota. Deselected unless CHARCTX_LIVE=1",
]
